#:schema https://macroplan.apoena.dev/macroplan.schema.json
#
# Reference Macroplan — a conformance sample exercising every field and state.
# The authoritative definition of this format is docs/format.md.

# Format version. Optional; the current version is 3. Omitting it means "3".
# Version 3 replaces `note` with `problem` and `countermeasure` (ADR-0005);
# version 2 added nested Features (`parent`, `weeks`, `reestimate_weeks`).
macroplan_version = 3

title = "Q3 — Checkout revamp"

# Optional plan span: pad the plan with lead-in / trailing weeks.
# Rule: `start` only ever extends the span left, `end` extends it right;
# neither clips a feature. Omit both to auto-fit the columns.
start = 2026-05-25
end = 2026-08-03

# Dates are TOML date literals. Any day snaps to that week's Monday.

# `area` groups features into bands. A feature belongs to at most one Area
# (ADR-0003); Areas are implicit — the set of values used, ordered by first
# appearance. Matched case-insensitively after trimming.
#
# On-time delivery: delivered on/before the Original Estimate → ◉ (subsumes ◯).
[[feature]]
name = "Auth"
area = "Platform"
start = 2026-06-01
original = 2026-06-15
delivered = 2026-06-15
learning = "Spiking the OAuth flow first paid off — do discovery spikes earlier."

# Late delivery with slips: ◯ baseline kept, one △ per re-estimate, then ▲.
# Late because delivery (07-20) is after `original` (06-15) — the re-estimates
# never move the goalpost (ADR-0001).
[[feature]]
name = "Payments"
area = "Platform"
start = 2026-06-01
original = 2026-06-15
reestimates = [2026-06-29, 2026-07-13]
delivered = 2026-07-20
learning = "Vendor lead time was the real constraint — derisk vendors up front."

# In-flight and overdue: undelivered, `original` already in the past → ◯, then
# a dashed bar to a dashed △ Forecast in the current week — a slip nobody has
# recorded yet. `status` expresses confidence while it's open. Off-track means
# in trouble with no Countermeasure yet: it may state its `problem` only.
[[feature]]
name = "Dashboard"
area = "Product"
start = 2026-06-01
original = 2026-06-08
status = "off-track"
problem = "No owner since the reorg."

# In-flight, re-estimated once: ◯ + △, still open. At-risk means in trouble
# with a Countermeasure: `countermeasure` is required, `problem` optional.
[[feature]]
name = "Search"
area = "product" # same Area as Dashboard — matching ignores case
start = 2026-06-08
original = 2026-06-22
reestimates = [2026-07-06]
status = "at-risk"
problem = "Third-party search API is flaky."
countermeasure = "Spike a fallback on the in-house index."

# In-flight, on track: the minimal feature — only the three required fields
# plus a status. No `area`, so it joins the unlabelled band rendered first.
[[feature]]
name = "Notifications"
start = 2026-06-22
original = 2026-07-06
status = "on-track"

# Nested Features (v2): a parent carries no dates — they are derived from its
# children, which chain in file order. Children plan in `weeks`; the first leaf
# of the chain sets `start`, the anchor. Planned: Vendor contract 06-01…06-08
# (◯ 06-08), Integration 06-15…06-29 (◯ 06-29). Vendor contract landed a week
# late, so Integration can't start before 06-22: its Forecast is 07-06, a
# dashed △ after its unmoved ◯.
[[feature]]
name = "Checkout flow"
area = "Product"
status = "at-risk"
problem = "Vendor slip is eating the buffer."
countermeasure = "Cut Rollout to the two largest markets."

[[feature]]
name = "Vendor contract"
parent = "Checkout flow"
start = 2026-06-01
weeks = 2
delivered = 2026-06-15

[[feature]]
name = "Integration"
parent = "Checkout flow"
weeks = 3

# A later leaf with its own `start` is unlinked from its predecessor: it starts
# 06-29 whatever Integration does — overlapping it here — so Integration's slip
# never reaches it, and the chain carries on from it.
[[feature]]
name = "Load testing"
parent = "Checkout flow"
start = 2026-06-29
weeks = 2

# A re-estimate on a child revises its Duration: Rollout is planned 07-13…07-20
# after Load testing (◯ 07-20); its `△` lands at its real start plus 3 weeks
# (07-27), and moves with the chain. Checkout flow's Original Estimate and
# Forecast are the latest of its children's: ◯ 07-20, Forecast 07-27.
[[feature]]
name = "Rollout"
parent = "Checkout flow"
weeks = 2
reestimate_weeks = [3]

# Weeks the whole team is off. Drawn as hatched columns; they move no date.
# `to` is optional (absent → the single week of `from`).
[[break]]
name = "Summer offsite"
from = 2026-07-27
to = 2026-07-31

# Milestones tie a due week to the features that must ship by then.
[[milestone]]
name = "Code freeze"
week = 2026-06-29
requires = ["Auth", "Payments"]

[[milestone]]
name = "MVP go-live"
week = 2026-07-06
requires = ["Auth", "Payments", "Dashboard"]

# A milestone may require a Feature at any depth — requiring a parent is met
# once every one of its children has been delivered.
[[milestone]]
name = "Beta launch"
week = 2026-07-13
requires = ["Search", "Notifications", "Checkout flow"]
